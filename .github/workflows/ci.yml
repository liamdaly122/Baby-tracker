name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Format lint
        run: swift format lint --strict --recursive Package.swift Sources Tests Apps

  content:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint content
        run: python3 -I Scripts/content-lint.py
      - name: Lint self-tests
        run: python3 -I -m unittest discover -s Scripts -p 'test_*.py'

  # macOS minutes cost 10x, so this only runs on main or on PRs labelled needs-mac.
  mac:
    name: Apps (macOS)
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'needs-mac')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: Package tests
        run: swift test
      - name: Generate project
        run: Scripts/gen-project.sh
      - name: Build iOS app with widgets and watch app
        run: >
          xcodebuild build -project MissionControl.xcodeproj -scheme MissionControl
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Build watch app
        run: >
          xcodebuild build -project MissionControl.xcodeproj -scheme MissionControlWatch
          -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO
