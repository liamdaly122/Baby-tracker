name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits, with the release in a comment. The toolchains match local
# development: Swift 6.4.2 and Xcode 27.2.
jobs:
  linux:
    name: Package (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Format lint
        run: swift format lint --strict --recursive Package.swift Sources Tests Apps

  content:
    name: Content lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint content
        run: python3 -I Scripts/content-lint.py
      - name: Lint store listing claims
        run: python3 -I Scripts/claims-lint.py
      - name: Lint self-tests
        run: python3 -I -m unittest discover -s Scripts -p 'test_*.py'

  # Runs on every pull request: GitHub's macOS runners are free for public repositories. Xcode 27
  # is only on the xcode-27 image so far, which GitHub still calls a preview.
  mac:
    name: Apps (macOS)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Scripts/ci-install-tools.sh') }}
      - name: Install pinned tools
        run: Scripts/ci-install-tools.sh
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: Package tests
        run: swift test
      - name: Generate project
        run: Scripts/gen-project.sh
      - name: Build and test iOS app with widgets and watch app
        run: >
          xcodebuild test -project MissionControl.xcodeproj -scheme MissionControl
          -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO
      - name: Build and test watch app
        # On watchOS, text sizes depend on the watch's screen size, so the watch's pictures only
        # match on the model they were drawn on: an Apple Watch Ultra 2 (49mm), on the newest
        # watchOS runtime the runner has (watchOS 27). Some runners come without one (main's run
        # after PR #20 did), so it's downloaded for this Xcode when it's missing.
        run: |
          newest_watch_runtime() {
            xcrun simctl list runtimes available --json | python3 -c '
          import json, sys
          watch = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "watchOS"]
          if watch:
              print(max(watch, key=lambda r: [int(p) for p in r["version"].split(".")])["identifier"])
          '
          }
          RUNTIME=$(newest_watch_runtime)
          if [ -z "$RUNTIME" ]; then
            echo "No watchOS simulator on this runner, so downloading one."
            xcodebuild -downloadPlatform watchOS
            RUNTIME=$(newest_watch_runtime)
          fi
          echo "Watch runtime: $RUNTIME"
          WATCH=$(xcrun simctl create "Picture tests watch" \
            com.apple.CoreSimulator.SimDeviceType.Apple-Watch-Ultra-2-49mm "$RUNTIME")
          xcodebuild test -project MissionControl.xcodeproj -scheme MissionControlWatch \
            -destination "id=$WATCH" CODE_SIGNING_ALLOWED=NO
