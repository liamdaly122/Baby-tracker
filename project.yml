# XcodeGen spec. Run Scripts/gen-project.sh to produce MissionControl.xcodeproj (gitignored).
# The Swift package at the repo root is the source of truth; these targets are thin shells.
name: MissionControl

options:
  bundleIdPrefix: com.liamdaly
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MissionKit:
    path: .

targets:
  MissionControl:
    type: application
    platform: iOS
    sources:
      - Apps/MissionControl
    dependencies:
      - package: MissionKit
        product: MissionCore
      - package: MissionKit
        product: MissionContent
      - package: MissionKit
        product: MissionUI
      - target: MissionControlWidgets
      - target: MissionControlWatch
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamdaly.missioncontrol
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mission Control
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Apps/MissionControl/MissionControl.entitlements
    scheme: {}

  MissionControlWatch:
    type: application
    platform: watchOS
    sources:
      - Apps/MissionControlWatch
    dependencies:
      - package: MissionKit
        product: MissionCore
      - package: MissionKit
        product: MissionUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamdaly.missioncontrol.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mission Control
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.liamdaly.missioncontrol
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Apps/MissionControlWatch/MissionControlWatch.entitlements
    scheme: {}

  MissionControlWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Apps/MissionControlWidgets
    dependencies:
      - package: MissionKit
        product: MissionCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liamdaly.missioncontrol.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Apps/MissionControlWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Mission Control Widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Apps/MissionControlWidgets/MissionControlWidgets.entitlements
